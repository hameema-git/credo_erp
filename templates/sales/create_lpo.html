
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Create LPO</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Calibri, sans-serif;
            background: #f5f6fa;
        }

        .container-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            height: 70px;
        }

        .company-info {
            font-size: 13px;
            color: #555;
        }

        .table thead {
            background: linear-gradient(90deg,#362c7a,#741960,#d0153e);
            color: white;
        }

        .desc-box {
            min-height: 40px;
            resize: none;
        }

        .total-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
        }

        .btn-gradient {
            background: linear-gradient(90deg,#362c7a,#741960,#d0153e);
            border: none;
            color: white;
        }
    </style>
</head>

<body>

<div class="container mt-3">
<div class="container-box">

<!-- HEADER -->
<div class="header">
    <div class="d-flex align-items-center gap-3">
        <img src="{% static 'logo6.png' %}" class="logo">
        <div class="company-info">
            <b>CREDO INTERNATIONAL DIGITAL DESIGNS</b><br>
            TRN: 105189276600001<br>
            Abu Dhabi, UAE<br>
            +971566981200
        </div>
    </div>

    <h4><b>LOCAL PURCHASE ORDER</b></h4>
</div>

<form method="POST">
{% csrf_token %}

<div class="mb-4">
    <label><b>Supplier</b></label>

    <select name="supplier" class="form-select" required>
        <option value="">Select Supplier</option>
        {% for s in suppliers %}
        <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
    </select>

    <a href="{% url 'add_supplier' %}" class="btn btn-sm btn-success mt-2">
        + Add Supplier
    </a>
</div>

<div class="mb-3">
    <label><b>Quotation Ref</b></label>
    <input type="text" name="quote_ref" class="form-control" placeholder="Enter quotation reference">
</div>

<!-- CURRENCY -->
<div class="row mb-3">
    <div class="col-md-6">
        <label><b>Currency</b></label>
        <select name="currency" id="currency" class="form-select">
            <option value="AED" selected>AED - UAE Dirham</option>
            <option value="INR">INR - Indian Rupee</option>
        </select>
    </div>
</div>

<!-- DATES -->
<div class="row mb-4">
    <div class="col-md-6">
        <label><b>Delivery Date</b></label>
        <input type="date" name="delivery_date" class="form-control">
    </div>
</div>

<!-- ITEMS -->
<h5><b>Items</b></h5>

<div class="table-responsive">
<table class="table table-bordered" id="items-table">
<thead>
<tr>
    <th>Description</th>
    <th>Unit Price (<span class="currency-label">AED</span>)</th>
    <th>Qty</th>
    <th>Total (<span class="currency-label">AED</span>)</th>
    <th>Action</th>
</tr>
</thead>

<tbody>
<tr>
<td>
<textarea name="description" class="form-control desc-box"></textarea>
</td>

<td>
<input type="number" step="0.01" name="price" class="form-control price" oninput="calculateRow(this)">
</td>

<td>
<input type="number" name="quantity" value="1" class="form-control" oninput="calculateRow(this)">
</td>

<td>
<input type="text" class="form-control row-total" readonly>
</td>

<td>
<button type="button" class="btn btn-danger btn-sm" onclick="deleteRow(this)">Delete</button>
</td>
</tr>
</tbody>
</table>
</div>

<button type="button" class="btn btn-secondary mb-3" onclick="addRow()">+ Add Item</button>

<!-- NOTE -->
<div class="mb-4">
    <label><b>Note</b></label>
    <textarea name="note" class="form-control" rows="3"></textarea>
</div>

<!-- TOTAL -->
<div class="row">
<div class="col-md-6"></div>

<div class="col-md-6">
<div class="total-box text-end">
<h6>Subtotal: <span class="currency-label">AED</span> <span id="subtotal">0.00</span></h6>
<h6 id="vat-label">VAT (5%): <span class="currency-label">AED</span> <span id="vat">0.00</span></h6>
<h4><b>Total: <span class="currency-label">AED</span> <span id="grand-total">0.00</span></b></h4>
</div>
</div>
</div>

<!-- ACTION -->
<div class="mt-4 d-flex justify-content-between">

    <button
        type="button"
        class="btn btn-secondary"
        onclick="history.back()">
        Back
    </button>

    <button type="submit" class="btn btn-gradient" id="saveBtn">
        Save LPO
    </button>
</div>

</form>

</div>
</div>

<script>
function getCurrency() {
    return document.getElementById("currency").value;
}

function getVatRate() {
    return getCurrency() === "AED" ? 0.05 : 0;
}

// function updateCurrencyLabels() {
//     const currency = getCurrency();

//     document.querySelectorAll(".currency-label").forEach(el => {
//         el.innerText = currency;
//     });

//     document.getElementById("vat-label").innerText =
//         currency === "AED" ? "VAT (5%): " : "VAT (0%): ";

//     calculateTotal();
// }
function updateCurrencyLabels() {
    const currency = getCurrency();

    document.querySelectorAll(".currency-label").forEach(el => {
        el.innerText = currency;
    });

    document.getElementById("vat-label").innerHTML =
        `${currency === "AED" ? "VAT (5%):" : "VAT (0%):"} 
         <span class="currency-label">${currency}</span>
         <span id="vat">0.00</span>`;

    calculateTotal();
}

function calculateRow(el) {
    calculateTotal();
}

//     let totalVat = 0;
//     let grandTotal = 0;

//     const vatRate = getVatRate();

//     document.querySelectorAll("#items-table tbody tr").forEach(row => {
//         let price = parseFloat(row.querySelector(".price").value) || 0;
//         let qty = parseFloat(row.querySelector("input[name='quantity']").value) || 0;

//         let base = price * qty;
//         let vat = base * vatRate;
//         let total = base + vat;

//         row.querySelector(".row-total").value = total.toFixed(2);

//         subtotal += base;
//         totalVat += vat;
//         grandTotal += total;
//     });

//     document.getElementById("subtotal").innerText = subtotal.toFixed(2);
//     document.getElementById("vat").innerText = totalVat.toFixed(2);
//     document.getElementById("grand-total").innerText = grandTotal.toFixed(2);
// }

function calculateTotal() {
    let subtotal = 0;
    let totalVat = 0;

    const vatRate = getVatRate();

    document.querySelectorAll("#items-table tbody tr").forEach(row => {
        const price = parseFloat(row.querySelector(".price").value) || 0;
        const qty = parseFloat(row.querySelector("input[name='quantity']").value) || 0;

        const base = price * qty;
        const vat = base * vatRate;
        const total = base + vat;

        row.querySelector(".row-total").value = total.toFixed(2);

        subtotal += base;
        totalVat += vat;
    });

    const grandTotal = subtotal + totalVat;

    document.getElementById("subtotal").innerText = subtotal.toFixed(2);
    document.getElementById("vat").innerText = totalVat.toFixed(2);
    document.getElementById("grand-total").innerText = grandTotal.toFixed(2);
}
function addRow() {
    let table = document.querySelector("#items-table tbody");
    let row = table.rows[0].cloneNode(true);

    row.querySelectorAll("input, textarea").forEach(el => el.value = "");

    row.querySelector("input[name='quantity']").value = "1";
    row.querySelector(".row-total").value = "";

    table.appendChild(row);
    calculateTotal();
}

function deleteRow(btn) {
    let table = document.querySelector("#items-table tbody");

    if (table.rows.length > 1) {
        btn.closest("tr").remove();
    } else {
        let row = btn.closest("tr");
        row.querySelectorAll("input, textarea").forEach(el => el.value = "");
        row.querySelector("input[name='quantity']").value = "1";
    }

    calculateTotal();
}

document.getElementById("currency").addEventListener("change", updateCurrencyLabels);

window.onload = function() {
    updateCurrencyLabels();
};
</script>

<script>
document.querySelector("form").addEventListener("submit", function() {
    let btn = document.getElementById("saveBtn");

    if (btn.disabled) {
        return false;
    }

    btn.disabled = true;

    btn.innerHTML = `
        <span class="spinner-border spinner-border-sm me-2"></span>
        Saving LPO...
    `;
});
</script>

</body>
</html>
